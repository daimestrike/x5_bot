# Реестр материалов бота (формат карточки v11: лист «Карточка чек-листа»).
# Правится владельцем содержания без участия разработчика; после правок — scripts/validate_content.py.
#
# Поля карточки:
#   id        постоянный код (A-07); допускается несколько записей с одним id и разными version —
#             бот показывает только запись со status: published, старые версии хранятся здесь же (status: retired)
#   type      answer (типовой вопрос) | instruction (инструкция) | checklist (чек-лист)
#   group     тема для навигации в меню (см. groups)
#   when      когда применять            prepare  что подготовить (условия)
#   steps     текст / действия: один пункт — одно действие, в порядке инструкции
#   result    ожидаемый результат (для чек-листа обязателен)
#   help      если не получается — к кому обратиться
#   source    документ, раздел, ссылка (link_key -> params.yaml links или явный url), версия источника
#   owner     ответственный   reviewer  проверяющий   version/checked  версия текста и дата проверки
#   status    draft | approved | published | retired   (выдаётся только published)
#
# ВНИМАНИЕ: тексты перенесены из реестра v9 («Черновик есть, нужна редактура») и опубликованы как стартовая
# база для пилота. Поля when/prepare/result/help заполнены по смыслу текста — их должен подтвердить проверяющий.
types:
- id: answer
  title: Типовые вопросы
- id: instruction
  title: Инструкции
- id: checklist
  title: Чек-листы
groups:
- id: A
  title: Подготовка до ПИ
- id: B
  title: Связь и сбои
- id: C
  title: Как снимать
- id: D
  title: Порядок и после ПИ
- id: E
  title: Этапы ПИ
