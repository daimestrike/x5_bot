- id: A-01
  section: A
  title: Что должно быть готово к ПИ?
  synonyms:
  - подготовка
  - комплект
  - заранее
  - что нужно
  steps:
  - 'До ПИ проверьте: ЭЦП и веб-табель; хотя бы один вход в Румс со своего телефона; комплект оборудования — ТСД,
    гарнитура, держатель, модем с сим-картой; заряд ТСД; зоны развешены по порядку. По каждому пункту есть отдельная
    тема в этом разделе.'
  source: Инструкция, инфографика, памятка
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-02
  section: A
  title: Что проверить по ЭЦП и веб-табелю?
  synonyms:
  - эцп
  - табель
  - заранее
  - переводы
  - увольнения
  steps:
  - Проверьте ЭЦП и присутствие по веб-табелю за несколько дней до ПИ — и в роли ЧК, и в роли МОЛ. Переводы и увольнения
    должны проходить не позднее чем за два дня до ПИ либо после неё. Без действующей ЭЦП комиссию не назначить.
  source: Инфографика
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-03
  section: A
  title: Почему нужно зайти в Румс заранее со своего телефона?
  synonyms:
  - румс
  - заранее
  - первый вход
  - ошибка
  steps:
  - Если вы ни разу не входили в Румс под своей учётной записью, вход на ТСД во время ПИ может не пройти. Авторизуйтесь
    заранее со своего телефона или компьютера — тогда ошибки при входе не будет.
  source: Инструкция, стр. 3
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-04
  section: A
  title: Как войти в Румс на ТСД?
  synonyms:
  - румс
  - вход
  - авторизация
  - логин
  - x5 ключ
  steps:
  - Свайпните вправо на главном экране ТСД и откройте «Румс».
  - Выберите «Корпоративный емейл».
  - Введите почту в домене @x5.ru.
  - Введите свой корпоративный логин и пароль от учётной записи.
  - Введите код из X5 Ключ, затем код из СМС.
  source: Инструкция, стр. 1-3
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-05
  section: A
  title: Как привязать ТСД к своему магазину?
  synonyms:
  - тсд
  - магазин
  - табельный
  - перезайти
  steps:
  - 'Перезайдите под своей учётной записью: Настройки — Данные приложения, выход из-под активной учётной записи.
    Затем введите номер магазина и табельный номер в оба поля.'
  source: Инфографика
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-06
  section: A
  title: Как собрать и надеть держатель?
  synonyms:
  - держатель
  - нагрудный
  - крепление
  - ремни
  - угол
  steps:
  - Установите ТСД в держатель и зафиксируйте.
  - Закрепите коннектор снизу.
  - Наденьте лямки и отрегулируйте ремни. Положение регулируется винтом, наклон — до 120 градусов.
  source: Инструкция, раздел «Сборка держателя»
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-07
  section: A
  title: Как включить модем и вставить сим-карту?
  synonyms:
  - модем
  - сим
  - симка
  - батарея
  - включить
  steps:
  - Снимите заднюю крышку модема, достаньте батарею, установите сим-карту в слот, соберите в обратном порядке.
  - Включите модем долгим нажатием кнопки питания.
  - На экране появятся имя сети и пароль — они свои у каждого устройства. В комплекте приходят модем, кабель питания
    и сим-карта.
  source: Инструкция, стр. 7
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-08
  section: A
  title: Что делать с зарядом ТСД и где держать телефон?
  synonyms:
  - заряд
  - батарея
  - зарядка
  - телефон
  steps:
  - 'Проверяйте заряд ТСД и заряжайте при любой возможности: он может отключиться в самый неподходящий момент. ТСД
    со звонком может лежать на зарядке, а мобильный телефон держите под рукой — вы всегда должны быть на связи.'
  source: Инфографика
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-09
  section: A
  title: Что проверить на тестовом звонке?
  synonyms:
  - тестовый звонок
  - проверка
  - готовность
  steps:
  - 'На тестовом звонке с ревизором убедитесь: связь стабильная; запись звонка возможна; видео проходит во всех
    помещениях магазина, включая склад; ТСД подключается к модему. Модем — резервный канал для магазинов с проблемной
    сетью.'
  source: Чек-лист ревизора
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: A-10
  section: A
  title: В каком порядке развешивать зоны?
  synonyms:
  - зоны
  - порядок
  - зонирование
  - метки
  steps:
  - Зоны нельзя тасовать — вешайте их по порядку, и в зале, и на складе. При повторном пересчёте удобнее видеть
    зал и склад последовательно, это экономит часы работы.
  source: Инфографика, памятка
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: B-01
  section: B
  title: Пропала внутренняя сеть магазина
  synonyms:
  - сеть
  - интернет
  - связь пропала
  - нет связи
  steps:
  - 'Включите модем и переключите ТСД: свайп сверху вниз — «Интернет» — сеть с именем, как на экране модема — пароль
    с экрана модема.'
  - Модем можно оставить в радиусе 10 метров от ТСД, держать при себе не нужно.
  - 'Сообщите ревизору о переключении: проблема фиксируется в чек-листе ПИ.'
  source: Инструкция, чек-лист ревизора
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: B-02
  section: B
  title: Модем не подключается
  synonyms:
  - модем
  - не подключается
  - пароль неверный
  - вайфай
  steps:
  - Проверьте, что модем включён и на экране видно имя сети.
  - Сверьте пароль с экраном модема — он индивидуален для каждого устройства.
  - Проверьте, что сим-карта установлена.
  - 'Поднесите модем ближе: он должен быть в радиусе 10 метров от ТСД.'
  source: Инструкция, стр. 7
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: B-03
  section: B
  title: Как вернуться на корпоративную сеть?
  synonyms:
  - корпоративная
  - сеть
  - вернуться
  - обратно
  steps:
  - Свайпните сверху вниз, откройте «Интернет» и выберите корпоративную сеть магазина. Порядок тот же, что и при
    подключении к модему.
  source: Инструкция, стр. 8
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: B-04
  section: B
  title: Не слышу вызов или не работают наушники
  synonyms:
  - звук
  - громкость
  - вызов
  - наушники
  - гарнитура
  steps:
  - Нажмите боковые клавиши громкости, откройте «Звук и вибрация», поднимите уровни «Разговор» и «Вызовы и уведомления».
  - Проверьте, что наушники подключены в порт зарядки ТСД.
  - 'Если гарнитура неисправна — сообщите ревизору: проблема фиксируется в чек-листе.'
  source: Инструкция, стр. 5
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: B-05
  section: B
  title: Звонок прервался
  synonyms:
  - звонок
  - прервался
  - перезвонить
  - чат
  steps:
  - Откройте «Чаты».
  - Выберите чат со специалистом КРР.
  - Нажмите кнопку вызова. Если чат открыт во время звонка, вернуться в звонок можно по зелёной плашке сверху.
  source: Инструкция, стр. 6
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: B-06
  section: B
  title: Плохое изображение или звук
  synonyms:
  - изображение
  - размыто
  - качество
  - тормозит
  - звук
  steps:
  - Переключитесь на тыловую камеру и протрите объектив.
  - Задержите камеру на объекте, чтобы навести фокус.
  - При проблемах со звуком поднесите микрофон ко рту и проверьте гарнитуру.
  - Если не помогло — переключитесь на модем и сообщите ревизору.
  source: Памятка, чек-лист ревизора
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: B-07
  section: B
  title: Румс не работает или запись не идёт
  synonyms:
  - румс
  - не работает
  - запись
  - зависло
  - сбой
  steps:
  - 'Сообщите ревизору сразу: этап без записи помечается комментарием в чек-листе.'
  - Закройте и откройте Румс, при необходимости перезайдите.
  - Если не восстановилось — запросите помощь. Переснимать этап задним числом нельзя.
  source: Чек-лист ревизора
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: B-08
  section: B
  title: ТСД завис или разрядился
  synonyms:
  - тсд
  - завис
  - перезагрузка
  - разрядился
  - выключился
  steps:
  - Поставьте ТСД на зарядку.
  - При зависании перезапустите устройство.
  - После перезапуска заново войдите в Румс и примите звонок.
  - 'Сообщите ревизору: перерыв фиксируется в чек-листе.'
  source: Чек-лист ревизора
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: C-01
  section: C
  title: Меня плохо слышно на записи
  synonyms:
  - микрофон
  - слышно
  - звук
  - громко
  steps:
  - Подносите микрофон гарнитуры ко рту, говорите громко и чётко. Иначе слова не попадут в запись и этап придётся
    переписывать.
  source: Памятка, «Как снимать»
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: C-02
  section: C
  title: Как снимать документы и деньги?
  synonyms:
  - документы
  - подпись
  - деньги
  - касса
  - лицо
  - рука
  steps:
  - 'Отойдите на расстояние. В кадре должны быть одновременно лицо, руки и документ или экран. Проверьте по правилу:
    лицо — рука — лист.'
  source: Памятка, «Как снимать»
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: C-03
  section: C
  title: Как снимать товар при сканировании?
  synonyms:
  - товар
  - этикетка
  - штрихкод
  - фокус
  - размыто
  steps:
  - Направляйте камеру на этикетку так, чтобы читались штрихкод и название. Если изображение размыто — задержите
    камеру на пару секунд и дайте ей сфокусироваться.
  source: Памятка, «Как снимать»
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: C-04
  section: C
  title: Можно ли снимать от первого лица?
  synonyms:
  - первое лицо
  - касса
  - глазами
  - аватар
  steps:
  - 'Да, если вы сами проверяете главную кассу или подписываете документ. Обязательно скажите вслух: «Я — ДМ магазина,
    работаю аватаром».'
  source: Памятка, «Как снимать»
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: C-05
  section: C
  title: Нужно ли представляться на камеру?
  synonyms:
  - представиться
  - фио
  - должность
  steps:
  - Да, практически на каждом этапе. Назовите ФИО и должность громко и чётко — ревизор повторит их вслух после вас.
  source: Памятка, инфографика
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: C-06
  section: C
  title: 'Ревизия ГК: как правильно записать?'
  synonyms:
  - сейф
  - деньги
  - дубль
  - купюры
  - ревизия гк
  steps:
  - 'Запись идёт одним дублем без остановки: открытие сейфа, выкладка денежных средств на стол, пересчёт купюр и
    монет с озвучиванием номиналов, фиксирование итогов.'
  source: Памятка, этап 8
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: D-01
  section: D
  title: Ревизор включил запись, что нажать?
  synonyms:
  - запись
  - согласие
  - согласен
  steps:
  - Появится окно «включил(а) запись звонка». Нажмите «Согласен на запись». Без согласия запись не ведётся.
  source: Инструкция, стр. 6
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: D-02
  section: D
  title: Какие кнопки есть во время звонка?
  synonyms:
  - кнопки
  - звонок
  - камера
  - микрофон
  - динамик
  - чат
  steps:
  - Видео включить или выключить — включаем. Микрофон. Переключение на динамик. Переключение с фронтальной камеры
    на тыловую — переключаемся на тыловую. Переход в текстовый чат с собеседником.
  source: Инструкция, стр. 6
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: D-03
  section: D
  title: Этап не удалось записать
  synonyms:
  - не записалось
  - пропустили
  - этап
  - комментарий
  steps:
  - 'Сообщите ревизору сразу. Этап помечается комментарием в чек-листе. Переснимать этап задним числом нельзя: запись
    должна соответствовать реальному ходу ПИ.'
  source: Чек-лист ревизора
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: D-04
  section: D
  title: ПИ стартует с задержкой
  synonyms:
  - задержка
  - старт
  - опоздание
  steps:
  - Сообщите ревизору причину и время задержки. Задержка старта ПИ фиксируется в чек-листе в часах — важно назвать
    её точно.
  source: Чек-лист ревизора
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: D-05
  section: D
  title: В каком меню делать подсчёты?
  synonyms:
  - меню
  - подсчёты
  - склад
  - зал
  steps:
  - Уточните у ревизора, в каком меню совершать подсчёты — по складу или по залу. Привычный, но неверный выбор приведёт
    к тому, что все подсчёты придётся начинать заново.
  source: Инфографика
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: D-06
  section: D
  title: Когда закрывать зоны после пересчёта?
  synonyms:
  - закрытие зон
  - кп
  - предпросмотр
  steps:
  - Завершайте задания контрольного пересчёта после предпросмотра на ТСД. Пропуск зон в КП результат не улучшит,
    а время ревизии увеличит.
  source: Инфографика
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: D-07
  section: D
  title: Что делать при двух параллельных ПИ?
  synonyms:
  - две пи
  - параллельно
  - приоритет
  - гк
  steps:
  - Две ревизии ГК одновременно не проводятся. При наложении этапов приоритет отдаётся процессу, который требует
    вашего прямого участия и коммуникации с магазином.
  source: Чек-лист ревизора
  url: ''
  version: 0.1.0
  date: '2026-09-14'
  owner: ''
  approved: false
  available: true
  status: draft
- id: D-08
  section: D
  title: Как закрыть сессию после ПИ?
  synonyms:
  - сессия
  - выход
  - разлогиниться
  - закрыть
  steps:
  - 'На ТСД: нажмите свою иконку и выберите «Закрыть сессию». Если забыли выйти — на телефоне: своя иконка, «Открытые
    сессии», «X» напротив ненужной сессии.'
  source: Инструкция, стр. 9
