- id: E-02
  section: E
  title: Что делать на любом этапе?
  synonyms:
  - этап
  - правило
  - представиться
  - снимать
  steps:
  - 'Три правила на каждом этапе: представьтесь — ФИО и должность, громко и чётко; показывайте на камеру то, что
    называет ревизор; для документов и денег держите в кадре лицо, руку и лист. Чем именно заниматься на этапе,
    вам говорит ревизор голосом.'
