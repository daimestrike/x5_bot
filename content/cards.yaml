- id: A-07
  type: checklist
  group: A
  title: Как включить модем и вставить сим-карту?
  when: При подготовке комплекта или когда пропала сеть магазина.
  prepare: Модем, сим-карта, кабель питания из комплекта.
  steps:
  - Снимите заднюю крышку модема, достаньте батарею, установите сим-карту в слот, соберите в обратном порядке.
  - Включите модем долгим нажатием кнопки питания.
  - На экране появятся имя сети и пароль — они свои у каждого устройства. В комплекте приходят модем, кабель питания и сим-карта.
  result: Модем включён, на его экране видны имя сети и пароль.
  help: Сообщите ревизору. Если ревизор недоступен — контакты в разделе «Нужна помощь».
