  group: B
  title: Пропала внутренняя сеть магазина
  when: Пропал интернет по сети магазина, звонок в Румс не идёт.
  prepare: Включённый модем с сим-картой.
  steps:
  - 'Включите модем и переключите ТСД: свайп сверху вниз — «Интернет» — сеть с именем, как на экране модема — пароль с экрана модема.'
  - Модем можно оставить в радиусе 10 метров от ТСД, держать при себе не нужно.
  - 'Сообщите ревизору о переключении: проблема фиксируется в чек-листе ПИ.'
  result: ТСД подключён к сети модема, звонок в Румс восстановлен, ревизор предупреждён.
  help: Сообщите ревизору. Если ревизор недоступен — контакты в разделе «Нужна помощь».
