- id: E-03
  section: E
  title: Кто ведёт этап — ревизор или я?
  synonyms:
  - кто ведёт
  - ревизор
  - демонстрация экрана
  steps:
  - 'Часть этапов ревизор записывает со своего экрана — открытие и закрытие ПИ в GK, формирование заданий: от вас
    нужно только оставаться на связи. На остальных этапах снимаете вы, а ревизор голосом говорит, что показать.
    Пошаговой инструкции по этапу у бота нет — это зона ревизора.'
