- id: A-04
  type: checklist
  group: A
  title: Как войти в Румс на ТСД?
  when: Перед тестовым звонком и в начале ПИ, когда нужно войти в Румс на ТСД.
  prepare: Учётная запись @x5.ru, приложение X5 Ключ на телефоне.
  steps:
  - Свайпните вправо на главном экране ТСД и откройте «Румс».
  - Выберите «Корпоративный емейл».
  - Введите почту в домене @x5.ru.
  - Введите логин вида ivan.ivanov и пароль от учётной записи.
  - Введите код из X5 Ключ, затем код из СМС.
  result: Открыт главный экран Румс под вашей учётной записью.
  help: Поддержка ТСД и Румс — контакты в разделе «Нужна помощь».
  synonyms:
  - румс
  - вход
  - авторизация
  - логин
  - x5 ключ
