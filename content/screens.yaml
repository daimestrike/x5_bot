# Тексты и кнопки экранов. Соответствуют листу «Экраны и кнопки» чек-листов v9.
# Подстановки: {section}, {title}, {link}, {query}. Кнопки задаются в коде по логике переходов;
# здесь — только подписи (labels) и тексты бота.
texts:
  S0: "Я справочник Аватара. Помогаю с подготовкой к ПИ, связью и сбоями, правилами съёмки и действиями после ПИ. По самим этапам вас ведёт ревизор голосом. Нажмите «Меню» — или напишите одно слово, например «модем»."
  S1: "Что нужно?"
  S2: "{section}. Выберите тему:"
  S3_more: "Подробнее: {link}"
  S3a: "Понял, спасибо. Если понадобится что-то ещё — «Меню»."
  S4: "Что не так?"
  S4a: "Записал. Можно открыть полную инструкцию: {link}. Если нужно решить сейчас — запросите помощь."
  S5: "Напишите одно-два слова: модем, пароль, зонирование, наушники, ЭЦП."
  S5a: "Нашёл по слову «{query}»:"
  S5b: "По слову «{query}» ничего не нашёл. Выберите раздел в меню или запросите помощь. Запрос я записал — тему добавим."
  S6: "С чем нужна помощь?"
  S7: "Я отвечаю по темам из меню и ищу по отдельным словам. Целиком вопрос понять не смогу. Открыть меню?"
  S7_attachment: "Я работаю с меню и отдельными словами в тексте. Голосовые, фото и файлы не обрабатываю. Открыть меню?"
  S7_action: "Действий в GK и Inventa я не выполняю — это делает ревизор."
  S7_thanks: "Рад помочь. Если понадобится что-то ещё — «Меню»."
  S8: "Не могу открыть материал. Полная инструкция: {link}. Если нужно срочно — запросите помощь."

labels:
