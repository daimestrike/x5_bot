# Тексты и подписи кнопок экранов (MVP v11: меню -> раздел -> тема -> материал; оценка; помощь; свободный текст).
# Подстановки: {section}, {type}, {link}, {query}, {help}.
texts:
  S0: "Я справочник Аватара. Здесь типовые вопросы, инструкции и чек-листы по удалённой ПИ и контакт для помощи. По ходу этапов вас ведёт ревизор голосом — бот его не заменяет."
  S1: "Что нужно?"
  S2: "{section}. Выберите тему:"
  S2_groups: "{section}. Выберите раздел:"
  S3_when: "Когда: {when}"
  S3_prepare: "Подготовьте: {prepare}"
  S3_result: "Результат: {result}"
  S3_help: "Если не получается: {help}"
  S3_more: "Полный документ: {link}"
  S3a: "Понял, спасибо. Если понадобится что-то ещё — «Меню»."
  S4: "Записал. Можно посмотреть другие темы или обратиться за помощью."
  S5: "Напишите одно-два слова: модем, наушники, ЭЦП."
  S5a: "Нашёл по слову «{query}»:"
  S5b: "По слову «{query}» ничего не нашёл. Выберите тему в меню или обратитесь за помощью."
  S6: "С чем нужна помощь?"
  S7: "Я не разбираю вопросы по смыслу — отвечаю только по темам из меню. Ваш вопрос записал, его посмотрит ответственный за материалы. Открыть меню?"
  S7_attachment: "Голосовые, фото и файлы я не обрабатываю — только темы из меню. Открыть меню?"
  S7_action: "Действий в GK и Inventa я не выполняю — это делает ревизор."
  S7_thanks: "Рад помочь. Если понадобится что-то ещё — «Меню»."
  S8: "Не могу открыть материал. Полный документ: {link}. Если нужно срочно — обратитесь за помощью."

