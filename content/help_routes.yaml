# Экран S6/S6a «Помощь человека». Контакты и порядок обращения заполняет владелец содержания.
# Ключи (pi / tech / org) используются в кнопках — не переименовывать.
routes:
  pi:
    button: "Вопрос по ПИ"
    text: |
      Вопрос по ходу ПИ решает ревизор — он на связи в звонке Румс.
      1. Если звонок активен — задайте вопрос голосом.
      2. Если звонок прервался — откройте «Чаты», выберите чат со специалистом КРР и нажмите кнопку вызова.
      3. Если ревизор недоступен более 10 минут — напишите куратору ПИ: {contacts.pi_curator}.
  tech:
    button: "Не работает техника"
    text: |
      Порядок обращения по технике (ТСД, Румс, модем, гарнитура, держатель):
      1. Сообщите ревизору — проблема фиксируется в чек-листе ПИ.
      2. Поддержка ТСД и Румс: {contacts.tsd_support}.
      3. При замене оборудования — куратор ПИ: {contacts.pi_curator}.
  org:
    button: "Организационный вопрос"
    text: |
      Организационные вопросы (состав комиссии, перенос ПИ, две ПИ одновременно, ЭЦП):
      1. Куратор ПИ: {contacts.pi_curator}.
      2. По ЭЦП и веб-табелю — {contacts.hr_support}.

contacts:
  pi_curator: "укажите контакт куратора ПИ"
  tsd_support: "укажите телефон/чат поддержки ТСД"
  hr_support: "укажите контакт по ЭЦП и табелю"
