<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Справочник Аватара — демо-консоль</title>
<style>
  :root { --bg:#f3f4f6; --bot:#fff; --user:#dcfce7; --accent:#16a34a; --text:#111827; --muted:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:#fff; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:16px; }
  header small { color:var(--muted); }
  header button { border:1px solid #d1d5db; background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; }
  #log { flex:1; padding:12px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:14px; white-space:pre-wrap; word-break:break-word; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .user { background:var(--user); align-self:flex-end; border-bottom-right-radius:4px; }
  .buttons { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .row button { flex:1 1 auto; min-height:40px; border:1px solid #d1d5db; background:#f9fafb; border-radius:10px; padding:8px 10px; cursor:pointer; font-size:14px; text-align:left; }
  .row button:hover { background:#eef2ff; }
  .screen { font-size:11px; color:var(--muted); margin-top:4px; }
  form { display:flex; gap:8px; padding:12px 16px; background:#fff; border-top:1px solid #e5e7eb; }
  input { flex:1; padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; font-size:15px; }
  form button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; }
  .extra { display:flex; gap:6px; padding:0 16px 10px; background:#fff; }
  .extra button { font-size:12px; border:1px dashed #d1d5db; background:#fff; border-radius:8px; padding:4px 8px; cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><b>Справочник Аватара</b><br><small>демо-консоль для приёмки, не Rooms</small></div>
    <button id="reset" title="Начать новый сеанс">Новый сеанс</button>
  </header>
  <div id="log"></div>
  <form id="f">
    <input id="t" placeholder="Слово для поиска или номер кнопки" autocomplete="off">
    <button type="submit">➤</button>
  </form>
  <div class="extra">
    <button data-att="voice">Отправить «голосовое»</button>
    <button data-att="photo">Отправить «фото»</button>
    <button data-att="file">Отправить «файл»</button>
  </div>
</div>
<script>
const log = document.getElementById('log');
const userId = 'demo-' + (localStorage.getItem('uid') || (Math.random().toString(36).slice(2)));
localStorage.setItem('uid', userId.replace('demo-',''));

function add(cls, text, buttons, screen) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (buttons && buttons.length) {
    const wrap = document.createElement('div'); wrap.className = 'buttons';
    let n = 0;
    buttons.forEach(row => {
      const r = document.createElement('div'); r.className = 'row';
      row.forEach(b => {
        n += 1;
        const btn = document.createElement('button');
        btn.textContent = n + '. ' + b.label;
        btn.onclick = () => send({callback: b.data}, b.label);
        r.appendChild(btn);
      });
      wrap.appendChild(r);
    });
    d.appendChild(wrap);
  }
  if (screen) { const s = document.createElement('div'); s.className = 'screen'; s.textContent = screen; d.appendChild(s); }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function send(body, echo) {
  if (echo) add('user', echo);
  body.user_id = userId;
  const r = await fetch('/api/console', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  data.messages.forEach((m, i) => add('bot', m.text, m.buttons, i === data.messages.length - 1 ? data.screen : ''));
}

document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const t = document.getElementById('t');
  const v = t.value.trim();
  if (!v) return;
  t.value = '';
  send({text: v}, v);
};
document.querySelectorAll('.extra button').forEach(b => b.onclick = () => send({attachment_type: b.dataset.att}, '[' + b.textContent + ']'));
document.getElementById('reset').onclick = async () => {
  await fetch('/api/console/reset', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({user_id:userId})});
  log.innerHTML = '';
  send({text: ''});
};
send({text: ''});
</script>
</body>
</html>
