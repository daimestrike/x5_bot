<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка диалога бота</title><link rel="stylesheet" href="/dev/style.css"><script src="/dev/app.js" defer></script></head>
<body><main><header><h1>Справочник Аватара</h1><p>Симулятор диалога · для разработки</p></header>
<section id="login"><p>В Rooms вход в этот симулятор не нужен. Здесь можно проверить черновики до подключения бота.</p><form id="login-form"><label for="token">Ключ разработчика (BOT_API_TOKEN)</label><div class="input-row"><input id="token" type="password" required autocomplete="off"><button type="submit">Открыть</button></div></form></section>
<section id="chat" hidden><div id="messages" role="log" aria-live="polite" aria-label="Сообщения бота"></div><form id="message-form"><label class="sr-only" for="query">Сообщение боту</label><div class="input-row"><input id="query" maxlength="500" placeholder="Например, модем" autocomplete="off"><button type="submit">Отправить</button></div></form><nav aria-label="Клавиатура бота"><button id="menu">Меню</button><button id="search">Поиск</button><button id="end">Завершить сеанс</button></nav></section>
<p id="status" role="status"></p></main></body></html>
