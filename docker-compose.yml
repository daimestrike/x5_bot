services:
  bot:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: rooms-avatar-bot:local
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./content:/app/content:ro   # правка карточек без пересборки образа (перезапуск контейнера)
    restart: unless-stopped
