# Runner and images must already be available inside X5. No public downloads.
stages: [check, package, build]
default:
  image: $PYTHON_IMAGE
variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_NO_INDEX: "1"
  PIP_FIND_LINKS: "wheels"
check:
  stage: check
  before_script:
    - python -m pip install -r requirements-dev.txt
  script:
    - python scripts/validate_content.py
    - python -m ruff check app scripts tests
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
package:
  stage: package
  script:
    - python scripts/package.py
  artifacts:
    paths: [dist/rooms-bot.zip]
# Opt-in shell runner with a preconfigured local Docker daemon; no privileged DinD.
build-image:
  stage: build
  tags: [rooms-docker]
  rules:
    - if: '$BUILD_IMAGE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker build --network=none --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
